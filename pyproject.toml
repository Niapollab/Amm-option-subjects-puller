[project]
name = "amm-option-subjects-puller"
version = "0.1.0"
description = "Утилита для скачивания предметов по выбору для факультета ПММ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "ctkmessagebox>=2.7",
    "customtkinter>=5.2.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
amm-puller-cli = "run_cli:main"
amm-puller-gui = "run_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "gui", "logic", "moodle", "run_cli.py", "run_gui.py"]

[tool.hatch.build.targets.sdist]
only-include = ["cli", "gui", "logic", "moodle", "run_cli.py", "run_gui.py", "README.md"]
